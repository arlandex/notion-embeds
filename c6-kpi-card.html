<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C6.0 | KPI card | MVP</title><style>*{box-sizing:border-box}body{margin:24px;color:#333;background:#fff;font:80%/1.45 system-ui,sans-serif}main{max-width:1000px;margin:auto}h1{font-size:1.3em;margin:0 0 20px}.groups{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch}fieldset{min-width:0;margin:0;padding:14px;border:1px solid #aaa;display:flex;flex-direction:column}legend{font-weight:700;padding:0 6px}p{margin:0 0 14px;color:#666}.fields{display:grid;gap:12px;grid-auto-rows:auto;align-content:start}.field{display:flex;flex-direction:column;min-width:0}.md{position:relative;align-self:flex-start;margin-bottom:6px}label{font-weight:650;cursor:help;border-bottom:0}label:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid #666;outline-offset:3px}.tip{display:none;position:absolute;left:0;bottom:100%;width:290px;max-width:75vw;padding:10px;background:#333;color:white;border:1px solid #333;z-index:5;font-weight:400}.md:hover .tip,.md:focus-within .tip{display:block}.md.dismiss .tip{display:none}textarea{display:block;width:100%;min-height:36px;resize:none;overflow:hidden;border:1px solid #bbb;border-radius:0;background:#eee;color:#333;padding:8px;font:inherit;line-height:1.45}.controls{display:flex;gap:12px;align-items:center;margin-top:20px}button{font:inherit;padding:8px 12px;background:#eee;border:1px solid #aaa;color:#333;cursor:pointer}#status{color:#666}@media(max-width:650px){.groups{grid-template-columns:1fr}body{margin:16px}}.groups>fieldset:nth-child(-n+2){grid-column:1/-1}.groups>fieldset:first-child .fields{grid-template-columns:repeat(2,minmax(0,1fr))}.groups>fieldset:nth-child(2) .fields{grid-template-columns:repeat(2,minmax(0,1fr))}legend.md{cursor:help;margin-bottom:10px}legend .tip{font-weight:400}legend{font-size:1.2em;cursor:help;margin-bottom:10px}body{color:#464B50;background:#F4F5F6}header{margin-bottom:32px}h1{font-size:1.7em;margin:0 0 4px}.meta{font-size:.9em;margin:12px 0 0;color:#686D72}fieldset,textarea,button{border-color:#CDD1D4}textarea,button{background:#E6E8EA;color:#464B50}#status{color:#686D72}.controls{flex-wrap:wrap}.field textarea{font-size:.9em}button:focus-visible,textarea:focus-visible{outline-color:#686D72}@media print{.controls{display:none}}</style></head><body><main><header><h1>C6.0 | KPI card | MVP</h1><p class="meta">V1 | 13 September 2026</p></header><div class="groups"><fieldset><legend tabindex="0" title="What is this field?">1. Identity &amp; meaning</legend><div class="fields"><div class="field"><div class="md"><label tabindex="0" for="md-1" title="Unique index identifying the dashboard field">MD 1 · Field identifier</label></div><textarea id="md-1" rows="1">304</textarea></div><div class="field"><div class="md"><label tabindex="0" for="md-2" title="Human-readable name of the dashboard field">MD 2 · Field name</label></div><textarea id="md-2" rows="1">Share of income saved (%)</textarea></div><div class="field"><div class="md"><label tabindex="0" for="md-3" title="Whether the field belongs to the input or output area">MD 3 · Field role</label></div><textarea id="md-3" rows="1">Output</textarea></div><div class="field"><div class="md"><label tabindex="0" for="md-4" title="Unit in which the field’s value is expressed">MD 4 · Unit of measure</label></div><textarea id="md-4" rows="1">%</textarea></div></div></fieldset><fieldset><legend tabindex="0" title="Where does its value come from?">2. Data lineage</legend><div class="fields"><div class="field"><div class="md"><label tabindex="0" for="md-5" title="Systems and reference tables supplying the field’s data or governing its mapping">MD 5 · Data provenance</label></div><textarea id="md-5" rows="1">Buxfer + Excel 1004 + Excel 1002</textarea></div><div class="field"><div class="md"><label tabindex="0" for="md-6" title="How source data becomes the field’s value or selection">MD 6 · Derivation method</label></div><textarea id="md-6" rows="1">Calculated</textarea></div></div></fieldset><fieldset><legend tabindex="0" title="How is its value determined?">3. Business rules</legend><div class="fields"><div class="field"><div class="md"><label tabindex="0" for="md-7" title="Underlying data type of the field’s value">MD 7 · Data type</label></div><textarea id="md-7" rows="1">Number</textarea></div><div class="field"><div class="md"><label tabindex="0" for="md-8" title="Formula or rules that determine the value and behaviour">MD 8 · Business logic</label></div><textarea id="md-8" rows="1">100 × (302 minus 303) / 302.</textarea></div><div class="field"><div class="md"><label tabindex="0" for="md-9" title="Included population, period and filters; denominator used for ratios">MD 9 · Calculation scope</label></div><textarea id="md-9" rows="1">Income denominator 302; selected net expenses 303.</textarea></div><div class="field"><div class="md"><label tabindex="0" for="md-10" title="Treatment of absent values, zero denominators and exceptional cases">MD 10 · Exception handling</label></div><textarea id="md-10" rows="1">Zero income: unavailable dash. Invalid/out-of-coverage dates or missing data: unavailable dash.</textarea></div></div></fieldset><fieldset><legend tabindex="0" title="How does the user see and use it?">4. Presentation &amp; interaction</legend><div class="fields"><div class="field"><div class="md"><label tabindex="0" for="md-11" title="Kind of dashboard control or output used for the field">MD 11 · UI component</label></div><textarea id="md-11" rows="1">KPI value</textarea></div><div class="field"><div class="md"><label tabindex="0" for="md-12" title="HTML control or element implementing the field, including its identifier where needed">MD 12 · Implementation specification</label></div><textarea id="md-12" rows="1">Read-only output; DOM id cash-flow-604</textarea></div><div class="field"><div class="md"><label tabindex="0" for="md-13" title="How values are displayed, including precision, symbols, dates and negative numbers">MD 13 · Display format</label></div><textarea id="md-13" rows="1">Whole percentage without + when positive; negatives formatted (X)%, e.g. (5)%; zero 0%.</textarea></div><div class="field"><div class="md"><label tabindex="0" for="md-14" title="Placement, dimensions and interaction behaviour of the field">MD 14 · Interaction design</label></div><textarea id="md-14" rows="1">Row 2, column 3. Dark #555 24 px box, bold white 12.8 px left-aligned value; pale #F5F5F5 background.</textarea></div><div class="field"><div class="md"><label tabindex="0" for="md-15" title="Background colour of the dashboard area containing the field">MD 15 · Visual styling</label></div><textarea id="md-15" rows="1">Gray</textarea></div></div></fieldset></div><div class="controls"><button id="download" type="button">Download saved copy</button><button id="clear" type="button">Clear all</button><span id="status" role="status">Edit any field, then download to keep your changes.</span></div></main><script>const fields=[...document.querySelectorAll('textarea')];
function fit(){fields.forEach(f=>{f.style.height='0px';f.style.minHeight='36px';f.style.height=Math.max(36,f.scrollHeight+2)+'px'})}
fields.forEach(f=>f.addEventListener('input',()=>{fit();document.querySelector('#status').textContent='Unsaved changes · Download a copy to keep them.'}));
window.addEventListener('resize',fit);fit();
let previousValues=null;document.querySelector('#clear').addEventListener('click',()=>{const button=document.querySelector('#clear');if(previousValues){fields.forEach((f,i)=>f.value=previousValues[i]);previousValues=null;button.textContent='Clear all';document.querySelector('#status').textContent='Entries restored.';}else{previousValues=fields.map(f=>f.value);fields.forEach(f=>f.value='');button.textContent='Undo clear';document.querySelector('#status').textContent='All fields cleared · Undo clear restores your entries.';}fit();});
document.querySelectorAll('.md').forEach(m=>{m.addEventListener('keydown',e=>{if(e.key==='Escape')m.classList.add('dismiss')});m.addEventListener('mouseleave',()=>m.classList.remove('dismiss'));m.addEventListener('focusin',()=>m.classList.remove('dismiss'))});
document.querySelector('#download').addEventListener('click',()=>{const clone=document.documentElement.cloneNode(true);clone.querySelectorAll('textarea').forEach((f,i)=>{f.textContent=fields[i].value;f.removeAttribute('style')});clone.querySelector('#clear').textContent='Clear all';clone.querySelector('#status').textContent='Edit any field, then download to keep your changes.';const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='c6-kpi-card.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('#status').textContent='Download requested · Check your Downloads folder.'});</script></body></html>
