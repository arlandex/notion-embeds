<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscription decision flow</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; }
    body {
      display: grid;
      place-items: start center;
      padding: 24px 12px 32px;
      color: #242426;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 780px); }
    svg { display: block; width: 100%; height: auto; overflow: visible; }
    .connector {
      fill: none;
      stroke: #747474;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#arrow);
    }
    .conditional { stroke-dasharray: 4 5; }
    .node rect {
      fill: #fff;
      stroke: #d9d7d3;
      stroke-width: 1;
      filter: url(#shadow);
    }
    .node.routing rect { stroke: #647cb9; stroke-width: 1.7; }
    .node.activity rect { fill: #edf1fb; stroke: #6b83bc; stroke-width: 1.25; }
    .node.decision rect { fill: #f2ecfa; stroke: #8d6fbc; stroke-width: 1.25; }
    .node.action rect { fill: #edf7ef; stroke: #67a57a; stroke-width: 1.15; }
    .code { fill: #9a8556; font-size: 11px; letter-spacing: .06em; text-anchor: middle; }
    .label { fill: #26262a; font-size: 15px; font-weight: 520; text-anchor: middle; }
    .activity .label, .decision .label, .action .label { font-weight: 610; }
    .branch-label { fill: #5c5c5c; font-size: 11px; font-weight: 560; }
    @media (max-width: 520px) {
      body { padding-inline: 4px; }
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 780 1100" role="img" aria-labelledby="flow-title flow-desc">
      <title id="flow-title">Subscription decision flow</title>
      <desc id="flow-desc">A flow from spending questions through review and value assessment to keep, change tier, cancel, or investigate actions.</desc>
      <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
          <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2f2b24" flood-opacity=".075"/>
        </filter>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L8 4 L0 8 Z" fill="#747474"/>
        </marker>
      </defs>

      <!-- Connectors: main path -->
      <path class="connector" d="M390 88 V122"/>
      <path class="connector" d="M390 184 V218"/>
      <path class="connector" d="M390 290 V416"/>
      <text class="branch-label" x="402" y="360">Y</text>
      <path class="connector" d="M250 254 H173 V311"/>
      <text class="branch-label" x="226" y="244">N</text>
      <path class="connector" d="M173 407 V450 H246"/>
      <path class="connector" d="M390 488 V522"/>
      <path class="connector" d="M390 584 V618"/>
      <path class="connector" d="M390 690 V732"/>
      <text class="branch-label" x="402" y="716">Y</text>

      <!-- Conditional paths -->
      <path class="connector conditional" d="M530 153 H688 V886"/>
      <path class="connector conditional" d="M530 553 H688"/>
      <path class="connector conditional" d="M250 654 H86 V886"/>
      <text class="branch-label" x="99" y="674">N</text>

      <!-- Treatment decisions -->
      <path class="connector" d="M390 794 V832 H91 V886"/>
      <path class="connector" d="M390 794 V886"/>
      <path class="connector" d="M390 832 H489 V886"/>

      <!-- Decisions to actions -->
      <path class="connector" d="M91 958 V996"/>
      <path class="connector" d="M290 958 V996"/>
      <path class="connector" d="M489 958 V996"/>
      <path class="connector" d="M688 958 V996"/>

      <!-- Questions and activities -->
      <g class="node" transform="translate(250 16)">
        <rect width="280" height="72" rx="16"/>
        <text class="code" x="140" y="22">1211</text>
        <text class="label" x="140" y="44"><tspan x="140">How much am I spending on this</tspan><tspan x="140" dy="18">subscription?</tspan></text>
      </g>
      <g class="node activity" transform="translate(250 122)">
        <rect width="280" height="62" rx="15"/>
        <text class="code" x="140" y="22">1221</text>
        <text class="label" x="140" y="43">Review spend</text>
      </g>
      <g class="node routing" transform="translate(250 218)">
        <rect width="280" height="72" rx="16"/>
        <text class="code" x="140" y="22">1212</text>
        <text class="label" x="140" y="48">Is the spend in line with expectations?</text>
      </g>
      <g class="node" transform="translate(88 311)">
        <rect width="170" height="96" rx="16"/>
        <text class="code" x="85" y="22">1213</text>
        <text class="label" x="85" y="44"><tspan x="85">What explains</tspan><tspan x="85" dy="18">changes in</tspan><tspan x="85" dy="18">charges?</tspan></text>
      </g>
      <g class="node" transform="translate(250 416)">
        <rect width="280" height="72" rx="16"/>
        <text class="code" x="140" y="22">1214</text>
        <text class="label" x="140" y="44"><tspan x="140">Is the spending in line with the</tspan><tspan x="140" dy="18">value received?</tspan></text>
      </g>
      <g class="node activity" transform="translate(250 522)">
        <rect width="280" height="62" rx="15"/>
        <text class="code" x="140" y="22">1222</text>
        <text class="label" x="140" y="43">Assess value</text>
      </g>
      <g class="node routing" transform="translate(250 618)">
        <rect width="280" height="72" rx="16"/>
        <text class="code" x="140" y="22">1215</text>
        <text class="label" x="140" y="48">Does anything need actioning?</text>
      </g>
      <g class="node activity" transform="translate(250 732)">
        <rect width="280" height="62" rx="15"/>
        <text class="code" x="140" y="22">1223</text>
        <text class="label" x="140" y="43">Determine treatment</text>
      </g>

      <!-- Decisions -->
      <g class="node decision" transform="translate(6 886)">
        <rect width="170" height="72" rx="16"/>
        <text class="code" x="85" y="24">1231</text>
        <text class="label" x="85" y="49">Keep</text>
      </g>
      <g class="node decision" transform="translate(205 886)">
        <rect width="170" height="72" rx="16"/>
        <text class="code" x="85" y="24">1232</text>
        <text class="label" x="85" y="49">Change tier</text>
      </g>
      <g class="node decision" transform="translate(404 886)">
        <rect width="170" height="72" rx="16"/>
        <text class="code" x="85" y="24">1233</text>
        <text class="label" x="85" y="49">Cancel</text>
      </g>
      <g class="node decision" transform="translate(603 886)">
        <rect width="170" height="72" rx="16"/>
        <text class="code" x="85" y="24">1234</text>
        <text class="label" x="85" y="49">Investigate</text>
      </g>

      <!-- Actions -->
      <g class="node action" transform="translate(6 996)">
        <rect width="170" height="72" rx="16"/>
        <text class="code" x="85" y="24">1241</text>
        <text class="label" x="85" y="49">Do nothing</text>
      </g>
      <g class="node action" transform="translate(205 996)">
        <rect width="170" height="72" rx="16"/>
        <text class="code" x="85" y="24">1242</text>
        <text class="label" x="85" y="49">Change tier</text>
      </g>
      <g class="node action" transform="translate(404 996)">
        <rect width="170" height="72" rx="16"/>
        <text class="code" x="85" y="24">1243</text>
        <text class="label" x="85" y="49">Cancel</text>
      </g>
      <g class="node action" transform="translate(603 996)">
        <rect width="170" height="72" rx="16"/>
        <text class="code" x="85" y="24">1244</text>
        <text class="label" x="85" y="49">Find information</text>
      </g>
    </svg>
  </main>
</body>
</html>
