<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>C5.0 | Personal finance | MVP</title>
<style>
body{font:80%/1.5 system-ui,sans-serif;color:#222;background:#fff;margin:24px}main{max-width:720px}fieldset{border:1px solid #999;margin:0 0 16px;padding:16px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}label{display:block;margin-bottom:4px}input,select,button{font:inherit;box-sizing:border-box}select,input[type=text]{width:100%}.pair{display:flex;gap:8px}.pair label{flex:1;min-width:0;margin:0}.pair input{width:100%;min-width:0;padding:0 2px}h1{font-size:1.5em}p{margin:12px 0}.actions{display:flex;gap:8px}output:not([hidden]){display:block;margin-top:16px;white-space:pre-line}small{display:block;color:#555}
select,input[type=date]{height:24px}input[type=date]{border:1px solid rgb(118,118,118);border-radius:0}.range-pair{position:relative;height:24px;box-sizing:border-box;border:1px solid #999;border-radius:6px;background:#eee;--low:0%;--high:100%}.range-fill{position:absolute;top:0;bottom:0;left:var(--low);right:calc(100% - var(--high));background:#999;border-radius:5px;pointer-events:none}.range-pair input{position:absolute;inset:0;width:100%;height:22px;margin:0;background:transparent;appearance:none;pointer-events:none}.range-pair input::-webkit-slider-runnable-track{height:22px;background:transparent}.range-pair input::-webkit-slider-thumb{appearance:none;width:12px;height:22px;border:1px solid #555;border-radius:5px;background:#fff;pointer-events:auto;cursor:ew-resize}.range-pair input:focus-visible{outline:1px solid #555;border-radius:5px}.range-pair input:disabled::-webkit-slider-thumb{cursor:default;background:#ccc}
#outputs label{min-height:1.5em}#outputs output{box-sizing:border-box;width:100%;height:24px;border:1px solid #999;border-radius:2px;background:#555;color:#fff;padding:0 6px;font-size:1em;line-height:22px;font-weight:700;margin-top:0}
legend,.controls>div>label,#outputs label{font-weight:700}
select,input[type=date]{background-color:#fff;color:#222}select.is-selected,input[type=date].is-selected{background-color:#e5e5e5}
</style>
<main><h1>Consumables</h1><p>01/09/2025–31/08/2026</p>
<form id="filters"><fieldset><legend>Controls 101–108</legend><div class="controls">
<div><label for="tag">101 · Tag</label><select id="tag" name="tag"><option>All</option><option>Variable</option></select></div>
<div><label for="subtag">102 · Sub-tag</label><select id="subtag" name="subtag"><option>All</option><option>Consumables</option></select></div>
<div><label for="vendor">103 · Vendor or retailer</label><select id="vendor" name="vendor"><option value="All vendors">All</option><option>DeOnlineDrogist</option><option>Amazon</option><option>Muji</option><option>Temu</option><option>Etos</option><option>Albert Heijn</option><option>Dille &amp; Kamille</option><option>IKEA</option><option>Hema</option><option>H&amp;M Home</option><option>bol.com</option><option>Miele</option><option>Fornet Textile</option><option>Sellpy</option><option>Zara Home</option><option>Boots</option><option>Hendrik’s Schoenmaker</option><option>All one-off vendors</option></select></div>
<div><label for="account">104 · Account</label><select id="account" name="account"><option>All</option><option>Revolut Ultra</option><option>ABN Amro NL</option><option>AmEx UK</option></select></div>
<div><label for="transaction-type">105 · Transaction type</label><select id="transaction-type" name="transactionType"><option>All</option><option>Expense</option><option>Refund</option></select></div>
<div><label for="currency">106 · Original currency</label><select id="currency" name="currency"><option>All</option><option>EUR</option><option>GBP</option></select></div>
<div><label id="amount-label">107 · Transaction amount (€)</label><div class="range-pair"><div class="range-fill" aria-hidden="true"></div><input id="amount-min" name="amountMin" type="range" min="0" max="1" value="0" step="0.01" aria-label="Minimum transaction amount"><input id="amount" name="amount" type="range" min="0" max="1" value="1" step="0.01" aria-label="Maximum transaction amount"></div><div style="display:flex;justify-content:space-between"><span id="minimum">Min · —</span><span id="maximum">Max · —</span></div></div>
<div><label>108 · Date range (inclusive)</label><div class="pair"><label for="start"><input id="start" aria-label="From" name="start" type="date" required value="2025-09-01"></label><label for="end"><input id="end" aria-label="To" name="end" type="date" required value="2026-08-31"></label></div></div>
</div></fieldset>
<fieldset><legend>Section 2 · Classification</legend><div class="controls">
<div><label for="nature">201 · Nature</label><select id="nature" name="nature"><option>All</option><option>Recurring</option><option>Cancelled</option><option>LY only</option><option>One-off</option></select></div>
<div><label for="control">202 · Control</label><select id="control" name="control"><option>All</option><option>High</option><option>Medium</option><option>Low</option><option>None</option><option value="">-</option></select></div>
<div><label for="direct-debit">203 · Direct Debit</label><select id="direct-debit" name="directDebit"><option>All</option><option>Yes</option><option>No</option><option value="">-</option></select></div>
</div></fieldset></form>
<fieldset id="outputs"><legend>Section 3 · Outputs</legend><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px"><div><label for="total">301 · Total amount (€)</label><output id="total" aria-live="polite">—</output></div><div><label for="transaction-count">302 · Transactions #</label><output id="transaction-count" aria-live="polite">—</output></div><div><label for="refund-share">303 · Refunds (% of total)</label><output id="refund-share" aria-live="polite">—</output></div></div><div class="controls" style="margin-top:16px;grid-template-columns:repeat(3,1fr)"><div><label for="tag-share">304 · % of tag</label><output id="tag-share" aria-live="polite">—</output></div><div><label for="parent-share">305 · % of parent category</label><output id="parent-share" aria-live="polite">—</output></div><div><label for="expense-share">306 · % of total expenses</label><output id="expense-share" aria-live="polite">—</output></div></div><div class="controls" style="margin-top:16px;grid-template-columns:repeat(3,1fr)"><div><label for="ly-amount">307 · Change vs LY (€)</label><output id="ly-amount" aria-live="polite">—</output></div><div><label for="ly-share">308 · Change vs LY (%)</label><output id="ly-share" aria-live="polite">—</output></div></div></fieldset><div class="actions"><button type="reset" form="filters">Reset</button></div><p id="state" role="status"></p></main>
<script>
const transactions={"Hema": [398, 278, 949, 2084, 756, 477], "Fornet Textile": [1100], "All one-off vendors": [-4983, 2300, 4983, 299, 1000, 1779, 557, 699, 15000, 59, 5300, 1500, 3468, 800], "Amazon": [2180, -2399, 6898, 2399, 1899, 1544, 1031, 878, 998, 1282, 1233, 523, 1998, 1399, 2300, 499], "DeOnlineDrogist": [3720, 5664, 3552, 9280, 4375], "Etos": [8900, 1393], "Miele": [2958], "bol.com": [1145, 1442, 1498], "Albert Heijn": [600, 500, 6189], "Temu": [2532, 2382, 2607, 2560, 2227, 2018, 2327], "Sellpy": [299], "Muji": [8340, 9870], "IKEA": [5395], "Dille & Kamille": [5480], "H&M Home": [4497], "Zara Home": [], "Boots": [], "Hendrik\u2019s Schoenmaker": []};
const bounds={"All vendors":[-4983,15000,64],"DeOnlineDrogist":[3552,9280,5],"Amazon":[-2399,6898,16],"Muji":[8340,9870,2],"Temu":[2018,2607,7],"Etos":[1393,8900,2],"Albert Heijn":[500,6189,3],"Dille & Kamille":[5480,5480,1],"IKEA":[5395,5395,1],"Hema":[278,2084,6],"H&M Home":[4497,4497,1],"bol.com":[1145,1498,3],"Miele":[2958,2958,1],"Fornet Textile":[1100,1100,1],"Sellpy":[299,299,1],"All one-off vendors":[-4983,15000,14]};
const form=document.getElementById('filters'),state=document.getElementById('state'),amount=document.getElementById('amount'),lower=document.getElementById('amount-min'),end=document.getElementById('end'),vendor=document.getElementById('vendor');
const fmt=n=>(n/100).toLocaleString('en-GB',{maximumFractionDigits:0});
const accounting=(value,prefix='',suffix='',positiveSign=false)=>{const n=Math.round(value),text=prefix+Math.abs(n).toLocaleString('en-GB')+suffix;return n<0?'('+text+')':(positiveSign&&n>0?'+':'')+text;};
function accountEntries(name){const account=document.getElementById('account').value;return Object.entries(transactions).flatMap(([vendor,amounts])=>amounts.map(amount=>({vendor,amount,account:vendor==='All one-off vendors'&&amount===1000?'ABN Amro NL':vendor==='Amazon'&&amount===523?'AmEx UK':'Revolut Ultra'}))).filter(t=>(name==='All vendors'||t.vendor===name)&&(account==='All'||t.account===account)).map(t=>t.amount);}
function boundsAvailable(){return document.getElementById('currency').value==='All'&&document.getElementById('start').value==='2025-09-01'&&end.value==='2026-08-31';}
function selectedBounds(name){if(!boundsAvailable())return null;const type=document.getElementById('transaction-type').value;const entries=accountEntries(name).filter(v=>type==='All'||(type==='Expense'?v>0:v<0));return entries.length?[Math.min(...entries),Math.max(...entries),entries.length]:null;}
function showAmounts(){const b=selectedBounds(vendor.value);const track=document.querySelector('.range-pair'),span=Number(amount.max)-Number(amount.min);track.style.setProperty('--low',span?((Number(lower.value)-Number(lower.min))/span*100)+'%':'0%');track.style.setProperty('--high',span?((Number(amount.value)-Number(amount.min))/span*100)+'%':'0%');document.getElementById('minimum').textContent='Min · '+(b?fmt(Math.round(Number(lower.value)*100)):'—');document.getElementById('maximum').textContent='Max · '+(b?fmt(Math.round(Number(amount.value)*100)):'—');}
function updateBounds(name){const b=selectedBounds(name);for(const el of [lower,amount]){el.disabled=!b||b[0]===b[1];el.min=b?b[0]/100:0;el.max=b?b[1]/100:1;el.defaultValue=String(b?(el===lower?b[0]:b[1])/100:0);el.value=el.defaultValue;}showAmounts();}
function showSelections(){for(const el of form.querySelectorAll('select,input[type=date]'))el.classList.toggle('is-selected',el.tagName==='SELECT'?el.selectedIndex>0:el.value!==el.defaultValue);}
function clearOutputs(){for(const id of ['total','transaction-count','refund-share','tag-share','parent-share','expense-share','ly-amount','ly-share'])document.getElementById(id).textContent='—';}
form.addEventListener('input',e=>{end.setCustomValidity('');if(e.target.closest('fieldset')===form.querySelector('fieldset')&&e.target!==lower&&e.target!==amount)updateBounds(vendor.value);if(e.target===lower&&Number(lower.value)>Number(amount.value))lower.value=amount.value;if(e.target===amount&&Number(amount.value)<Number(lower.value))amount.value=lower.value;showAmounts();showSelections();renderOutputs()});
form.addEventListener('submit',e=>{e.preventDefault();renderOutputs();});
function renderOutputs(){const d=new FormData(form);clearOutputs();if(!d.get('start')||!d.get('end')||d.get('start')>d.get('end')){state.textContent='Choose a valid start and end date.';return}const supported=['currency','nature','control','directDebit'].every(k=>d.get(k)==='All')&&d.get('start')==='2025-09-01'&&d.get('end')==='2026-08-31';const total=document.getElementById('total');clearOutputs();if(supported){const entries=accountEntries(vendor.value);const min=Math.round(Number(lower.value)*100),max=Math.round(Number(amount.value)*100);const selected=entries.filter(v=>v>=min&&v<=max&&(d.get('transactionType')==='All'||(d.get('transactionType')==='Expense'?v>0:v<0)));const net=selected.reduce((sum,v)=>sum+v,0),refunds=-selected.filter(v=>v<0).reduce((sum,v)=>sum+v,0);total.textContent=accounting(net/100,'€');document.getElementById('transaction-count').textContent=selected.length.toLocaleString('en-GB');document.getElementById('refund-share').textContent=net>0?Math.round(refunds/net*100)+'%':'—';const tagNet=accountEntries('All vendors').reduce((sum,v)=>sum+v,0);document.getElementById('tag-share').textContent=tagNet>0?accounting(net/tagNet*100,'','%'):'—';if(d.get('account')==='All')document.getElementById('parent-share').textContent=accounting(net/2169627*100,'','%');
const comparisons={'All vendors':[-361,-18],'DeOnlineDrogist':[229,627],'Amazon':[-14,-5],'Muji':[-192,-51],'Temu':[47,39],'Etos':[18,21],'Albert Heijn':[73,null],'Dille & Kamille':[-57,-51],'IKEA':[-44,-45],'Hema':[-66,-57],'H&M Home':[12,38],'bol.com':[-53,-56],'Miele':[-46,-61],'Fornet Textile':[-1,-8],'Sellpy':[-3,-50],'Zara Home':[-132,-100],'Boots':[-90,-100],'Hendrik’s Schoenmaker':[-54,-100],'All one-off vendors':[12,4]};
const comparison=comparisons[vendor.value];if(d.get('account')==='All'&&d.get('transactionType')==='All'&&selected.length===entries.length&&comparison){document.getElementById('ly-amount').textContent=accounting(comparison[0],'','',true);document.getElementById('ly-share').textContent=comparison[1]===null?'—':accounting(comparison[1],'','%',true);}
state.textContent=d.get('account')==='All'?'':'Parent-category share and LY comparisons are unavailable for individual accounts.';}else{state.textContent='Currency, classification and date filtering are not connected yet. Set those to All and the original period to test vendor totals.';}}
form.addEventListener('reset',()=>{end.setCustomValidity('');setTimeout(()=>{updateBounds(vendor.value);showSelections();renderOutputs()},0);});updateBounds(vendor.value);renderOutputs();
</script></html>
